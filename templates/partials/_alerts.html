{# role="status" + aria-live so a screen reader announces "Invoice saved" etc. #}
<div class="alert-region" role="status" aria-live="polite" aria-atomic="false">
  {% for message in messages %}
    <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
      {{ message }}
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Dismiss this message"></button>
    </div>
  {% endfor %}
</div>
