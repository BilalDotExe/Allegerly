<nav class="side-nav" aria-label="Main navigation">
  <a class="side-link {% if nav_dashboard_active %}active{% endif %}" href="{% url 'dashboard' %}"><i class="nav-glyph fa-solid fa-house" aria-hidden="true"></i>Dashboard</a>
  {% for group in nav_groups %}
  <details class="nav-group{% if group.has_active %} has-active{% endif %}" data-group="{{ group.key }}" open>
    <summary class="nav-group-label"><span>{{ group.label }}</span><i class="nav-group-chevron fa-solid fa-chevron-down" aria-hidden="true"></i></summary>
    <div class="nav-group-items">
      {% for item in group.items %}
      <a class="side-link {% if item.active %}active{% endif %}" href="{{ item.href }}"><i class="nav-glyph fa-solid {{ item.icon }}" aria-hidden="true"></i>{{ item.label }}</a>
      {% endfor %}
    </div>
  </details>
  {% endfor %}
</nav>
