<nav class="side-nav" aria-label="Main navigation">
  <a class="side-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}" href="{% url 'dashboard' %}"><svg class="nav-icon" aria-hidden="true"><use href="#icon-home"/></svg>Dashboard</a>
  {% for group in sidebar_groups %}
  <div class="nav-group {% if group.open %}is-open{% endif %}">
    <button type="button" class="nav-group-toggle" aria-expanded="{% if group.open %}true{% else %}false{% endif %}">
      <span>{{ group.label }}</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <div class="nav-sub"><div class="nav-sub-inner">
      {% for item in group.items %}<a class="side-link {% if item.active %}active{% endif %}" href="{{ item.url }}"{% if item.active %} aria-current="page"{% endif %}><svg class="nav-icon" aria-hidden="true"><use href="#icon-{{ item.icon }}"/></svg>{{ item.label }}</a>{% endfor %}
    </div></div>
  </div>
  {% endfor %}
</nav>
