{% if page_obj and page_obj.paginator.num_pages > 1 %}
<nav aria-label="Page navigation"><ul class="pagination justify-content-center">
  <li class="page-item {% if not page_obj.has_previous %}disabled{% endif %}">{% if page_obj.has_previous %}<a class="page-link" href="?{% if pagination_query %}{{ pagination_query }}&amp;{% endif %}page={{ page_obj.previous_page_number }}" aria-label="Previous">&laquo;</a>{% else %}<span class="page-link">&laquo;</span>{% endif %}</li>
  {% for number in page_obj.paginator.page_range %}<li class="page-item {% if page_obj.number == number %}active{% endif %}"><a class="page-link" href="?{% if pagination_query %}{{ pagination_query }}&amp;{% endif %}page={{ number }}">{{ number }}</a></li>{% endfor %}
  <li class="page-item {% if not page_obj.has_next %}disabled{% endif %}">{% if page_obj.has_next %}<a class="page-link" href="?{% if pagination_query %}{{ pagination_query }}&amp;{% endif %}page={{ page_obj.next_page_number }}" aria-label="Next">&raquo;</a>{% else %}<span class="page-link">&raquo;</span>{% endif %}</li>
</ul></nav>
{% endif %}
