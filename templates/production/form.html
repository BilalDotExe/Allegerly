{% extends "base.html" %}
{% block title %}{{ title }} | Allegderly{% endblock %}
{% block content %}
<h1 class="form-page-title">{{ title }}</h1>
<div class="row"><div class="col-md-6">
  <form method="post" class="app-form">
    {% csrf_token %}
    {% for field in form %}
      <div class="mb-3{% if field.name == 'expiry_date' %} expiry-date-field{% endif %}">{% include "partials/_form_field.html" %}</div>
    {% endfor %}
    <button class="btn btn-primary">Save</button>
    <a href="{% url 'production:list' %}" class="btn btn-outline-secondary ms-2">Cancel</a>
  </form>
</div></div>
{% endblock %}
{% block extra_js %}<script>
(function () {
  var toggle = document.getElementById("id_has_expiry");
  var wrap = document.querySelector(".expiry-date-field");
  if (!toggle || !wrap) return;
  function sync() {
    wrap.hidden = !toggle.checked;
    if (!toggle.checked) {
      var cleared = false;
      wrap.querySelectorAll("input").forEach(function (input) {
        if (input._flatpickr) { input._flatpickr.clear(); cleared = true; }
      });
      if (!cleared) wrap.querySelectorAll("input").forEach(function (input) { input.value = ""; });
    }
  }
  toggle.addEventListener("change", sync);
  sync();
})();
</script>{% endblock %}
