{% extends "base.html" %}

{% block title %}{{ title }} | Allegderly{% endblock %}

{% block content %}
<div class="row">
  <div class="col-md-6">
    <h2>{{ title }}</h2>
    <form method="post" class="mt-3">
      {% csrf_token %}
      {% for field in form %}
        <div class="mb-3">
          <label class="form-label">{{ field.label }}</label>
          {{ field }}
          {% if field.errors %}
            <div class="text-danger small">{{ field.errors }}</div>
          {% endif %}
        </div>
      {% endfor %}
      <button type="submit" class="btn btn-primary">Save</button>
      <a href="{% url 'inventory:expiry_list' %}" class="btn btn-secondary ms-2">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
