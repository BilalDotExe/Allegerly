{% extends "base.html" %}

{% block title %}{{ title }} | Allegderly{% endblock %}

{% block content %}
<h1 class="form-page-title">{{ title }}</h1>
<div class="row">
  <div class="col-md-6">
    <form method="post" class="app-form">
      {% csrf_token %}
      {% for field in form %}
        <div class="mb-3">{% include "partials/_form_field.html" %}</div>
      {% endfor %}
      <button type="submit" class="btn btn-primary">Save</button>
      <a href="{% url 'inventory:expiry_list' %}" class="btn btn-outline-secondary ms-2">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
