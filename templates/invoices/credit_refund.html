{% extends "base.html" %}{% block title %}Mark Credit Refunded | Allegderly{% endblock %}{% block content %}<div class="row"><div class="col-md-6"><h2>Mark {{ credit.credit_number }} Refunded</h2><form method="post">{% csrf_token %}{% for field in form %}<div class="mb-3"><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% if field.errors %}<div class="text-danger small">{{ field.errors }}</div>{% endif %}</div>{% endfor %}<button class="btn btn-primary">Save Refund</button><a class="btn btn-secondary ms-2" href="{% url 'invoices:credit_detail' credit.pk %}">Cancel</a></form></div></div>{% endblock %}
