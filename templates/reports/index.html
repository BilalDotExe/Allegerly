{% extends "base.html" %}
{% block title %}Reports | Allegderly{% endblock %}
{% block content %}
<h2 class="mb-4">Reports</h2>
<div class="row g-3">
  {% for name, description, url_name in reports %}
  <div class="col-md-6 col-xl-4">
    <div class="card h-100">
      <div class="card-body">
        <h5 class="card-title"><a class="text-decoration-none" href="{% url url_name %}">{{ name }}</a></h5>
        <p class="card-text">{{ description }}</p>
        <a class="btn btn-outline-primary btn-sm" href="{% url url_name %}?export=csv">Export CSV</a>
      </div>
    </div>
  </div>
  {% endfor %}
</div>
{% endblock %}
