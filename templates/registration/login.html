{% extends "base.html" %}

{% block title %}Log in{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <h1 class="h3 mb-3 text-center">Allegderly</h1>
    <p class="text-muted text-center mb-4">Sign in to continue</p>

    {% if form.errors %}
      <div class="alert alert-danger" role="alert">
        Invalid username or password. Please try again.
      </div>
    {% endif %}

    <form method="post" action="{% url 'login' %}" novalidate>
      {% csrf_token %}
      <div class="mb-3">
        <label for="id_username" class="form-label">Username</label>
        <input type="text" name="username" autofocus required
               class="form-control" id="id_username"
               autocomplete="username" value="{{ form.username.value|default:'' }}">
      </div>
      <div class="mb-3">
        <label for="id_password" class="form-label">Password</label>
        <input type="password" name="password" required
               class="form-control" id="id_password"
               autocomplete="current-password">
      </div>
      {% if next %}
        <input type="hidden" name="next" value="{{ next }}">
      {% endif %}
      <button type="submit" class="btn btn-primary w-100">Log in</button>
    </form>
  </div>
</div>
{% endblock %}
